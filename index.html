<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyVibe</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header><img src="assets/SkyVibe.png" alt="SkyVibe logo" /></header>
    <article>
      <div class="dashboard-area">
        <div class="dashboard">
          <div class="title">
            <div class="weather-title">Weather Dashboard</div>
          </div>
          <div class="search-area">
            <input
              type="search"
              name="city-name"
              id="city-name-search"
              placeholder="Enter city name"
            />
            <div class="search">
              <div class="search-text">Search</div>
            </div>
          </div>
          <div class="result-area">
            <div class="major-area">
              <div class="1st-block">
                <div class="city-name-weather">
                  <div class="city-name">Orlando</div>
                  <div class="temperature">72 C</div>
                  <div class="weather-description">Sunny</div>
                </div>
              </div>
              <div class="2nd-block">
                <div class="weather-icon">
                  <img
                    width="150px"
                    src="assets/Cloudy day.png"
                    alt="weather-icon"
                  />
                </div>
              </div>
            </div>
            <div class="line"></div>
            <div class="humidity-wind">
              <div class="humidity-area">
                <div class="humidity">
                  Humidity:
                  <div class="humidity-percentage">60%</div>
                </div>
              </div>
              <div class="wind-area">
                <div class="wind">
                  Wind:
                  <div class="wind-vaule">5.2 km/h</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </article>
  </body>
</html>
