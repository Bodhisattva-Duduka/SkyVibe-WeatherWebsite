<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyVibe</title>
</head>
<body>
    <header></header>
    <article>
        <div class="dashboard-area">
            <div class="dashboard">
                <div class="title">Weather Dashboard</div>
                <div class="search-area">
                    <input type="search" name="city-name" id="city-name-search" placeholder="Enter city name">
                    <div class="search-text">Search</div>
                </div>
                <div class="result-area">
                    <div class="city-name-weather">
                        <div class="city-name">Orlando</div>
                        <div class="temperature">72 C</div>
                        <div class="weather-description">Sunny</div>
                    </div>
                    <div class="weather-icon"></div>
                    <div class="humidity-wind">
                        <div class="humidity">60%</div>
                        <div class="wind">5.2 km/h</div>
                    </div>
                </div>
            </div>
        </div>
    </article>
</body>
</html>
